<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIMPULSO - Redes Sociales</title>

<!-- ICONOS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #f2f5ff, #ffe9f0);
        display: flex;
        justify-content: center;
        padding: 20px;
        min-height: 100vh;
    }

    .container {
        background: white;
        width: 100%;
        max-width: 420px;
        border-radius: 20px;
        padding: 25px;
        box-shadow: 0 15px 35px #00000025;
        text-align: center;
        animation: fadeIn 0.8s ease;
    }

    /* Animación */
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* Logo cuadrado */
    .profile-img {
        width: 200px;
        height: 200px;
        border-radius: 20px;
        border: 4px solid #ddd;
        margin-bottom: 15px;
        object-fit: contain;
        background: white;
        padding: 15px;
        transition: transform 0.3s;
    }

    .profile-img:hover {
        transform: scale(1.05);
    }

    h1 {
        margin: 5px 0;
        font-size: 28px;
        font-weight: bold;
        letter-spacing: 1px;
    }

    p {
        color: #666;
        margin-bottom: 20px;
        font-size: 15px;
    }

    /* Botones con colores oficiales */
    .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;

        margin: 12px 0;
        padding: 15px;

        color: white;
        font-size: 17px;
        font-weight: bold;

        border-radius: 12px;
        text-decoration: none;

        transition: transform 0.25s, opacity 0.25s;
    }

    .btn:hover {
        transform: translateY(-4px);
        opacity: 0.85;
    }

    .facebook { background: #1877f2; }
    .instagram { background: linear-gradient(45deg, #feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5); }
    .tiktok { background: #000; }
    .whatsapp { background: #25d366; }
    .youtube { background: #ff0000; }

    footer {
        margin-top: 25px;
        font-size: 13px;
        color: #777;
    }
</style>
</head>

<body>

<div class="container">

    <!-- Logo cuadrado con bordes redondeados -->
    <img src="logo.png" class="profile-img" alt="Logo DECO & EVENTOS">

    <h1>TIMPULSO</h1>
    <p> Taller Montaje – Actuación – Producción – Merchandising</p>

    <!-- Botones con colores e íconos — Tus links EXACTOS -->
    <a class="btn facebook" 
       href="https://www.facebook.com/share/1AY4nScjpz/" 
       target="_blank">
       <i class="fa-brands fa-facebook-f"></i> Facebook
    </a>

    <a class="btn instagram" 
       href="https://www.instagram.com/timpulsso?igsh=MWwwcGIxOWxtZ2lrNw==" 
       target="_blank">
       <i class="fa-brands fa-instagram"></i> Instagram
    </a>

    <a class="btn tiktok" 
       href="https://www.tiktok.com/@timpulsopro?_r=1&_t=ZS-94UqsHi8S7J" 
       target="_blank">
       <i class="fa-brands fa-tiktok"></i> TikTok
    </a>

    <a class="btn whatsapp" 
       href="https://wa.me/51937623908" 
       target="_blank">
       <i class="fa-brands fa-whatsapp"></i> WhatsApp
    </a>

    <footer>© 2026 TIMPULSO PRODUCCIONES</footer>

</div>

</body>
</html>
